[project]
name = "locus"
version = "0.1.0"
description = "Privacy-first local focus and recall system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
develop = [
  "pytest==8.3.2",
  "ruff==0.6.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
